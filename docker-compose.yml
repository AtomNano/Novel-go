version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: novel-go-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: novel_db
      MYSQL_USER: novel_user
      MYSQL_PASSWORD: novel_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - novel-go-net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: novel-go-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: novel_user
      PMA_PASSWORD: novel_password
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - novel-go-net

  # Auth Service (Node.js)
  auth-service:
    build: ./auth-service
    container_name: novel-go-auth
    ports:
      - "3001:3001"
    volumes:
      - ./auth-service:/app
      - /app/node_modules
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: novel_db
      DB_USER: novel_user
      DB_PASSWORD: novel_password
      JWT_SECRET: your_jwt_secret_key_here_change_in_production
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - novel-go-net

  # Content Service (PHP/Lumen) - Replaces content-service
  novel_core:
    build: ./novel_core
    container_name: novel-go-core
    ports:
      - "8080:8080"
    volumes:
      - ./novel_core:/var/www
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: novel_db
      DB_USERNAME: novel_user
      DB_PASSWORD: novel_password
      JWT_SECRET: your_jwt_secret_key_here_change_in_production
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - novel-go-net

  # Interaction Service (Python) - Replaces interaction-service
  social_service:
    build: ./social_service
    container_name: novel-go-social
    ports:
      - "5003:5003"
    volumes:
      - ./social_service:/app
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: novel_db
      DB_USER: novel_user
      DB_PASSWORD: novel_password
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - novel-go-net

  # Collection Service (Node.js)
  collection-service:
    build: ./collection-service
    container_name: novel-go-collection
    ports:
      - "3002:3002"
    volumes:
      - ./collection-service:/app
      - /app/node_modules
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: novel_db
      DB_USER: novel_user
      DB_PASSWORD: novel_password
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - novel-go-net

networks:
  novel-go-net:
    driver: bridge

volumes:
  mysql_data:
